name: Release

# Когда PR из release/X.Y.Z смержен в develop (обычно через squash — один коммит на релиз):
#   1) собирается установщик (NSIS) с подписью для автообновления и публикуется GitHub Release X.Y.Z
#      (тег X.Y.Z ставится на коммит релиза в develop, в релиз кладётся latest.json для обновлятора);
#   2) main догоняет этот коммит (только fast-forward) — после релиза main == develop,
#      релизная ветка удаляется.
# Вручную: workflow_dispatch с номером релиза — например, если упал шаг после сборки.
# Ветка release/X.Y.Z может быть уже удалена: тогда берётся смерженный PR из неё.
# Уже опубликованный релиз повторно не собирается.
#
# Триггер — push в develop (мерж PR тоже push), а не pull_request_target: его GitHub ограничивает
# в публичных репозиториях. Workflow и секреты environment "release" берутся из develop,
# код релизной ветки собирается только после проверки, что он уже смержен в develop.
on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      release_branch:
        description: 'Релиз: 0.2.0 или release/0.2.0'
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Был ли этот push мержем релизной ветки? Для обычных фич дальше ничего не запускается.
  detect:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      branch: ${{ steps.meta.outputs.branch }}
      sha: ${{ steps.meta.outputs.sha }}
      published: ${{ steps.meta.outputs.published }}
      notes: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Какой релиз
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          MANUAL_BRANCH: ${{ inputs.release_branch }}
          PUSH_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # MERGED — коммит в develop, которым смержили релизный PR (при squash это и есть коммит релиза)
          MERGED=""
          if [ "$EVENT" = "workflow_dispatch" ]; then
            BRANCH="release/${MANUAL_BRANCH#release/}"
            if git rev-parse -q --verify "origin/$BRANCH" >/dev/null; then
              SHA=$(git rev-parse "origin/$BRANCH")
            else
              # ветку уже удалили после мержа — берём смерженный PR из неё
              PR=$(gh pr list -R "$REPO" --state merged --head "$BRANCH" --json headRefOid,mergeCommit \
                --jq '.[0] // empty | "\(.headRefOid) \(.mergeCommit.oid)"')
              [ -n "$PR" ] || { echo "::error::Нет ни ветки $BRANCH, ни смерженного PR из неё"; exit 1; }
              read -r SHA MERGED <<< "$PR"
            fi
          else
            # смерженный PR из release/**, которому принадлежит этот коммит
            # (ветку могли удалить при мерже, поэтому берём коммит, а не имя)
            PR=$(gh api "repos/$REPO/commits/$PUSH_SHA/pulls" \
              --jq '[.[] | select(.merged_at != null and (.head.ref | startswith("release/")))][0] // empty | "\(.head.ref) \(.head.sha)"')
            if [ -z "$PR" ]; then
              echo "Это не мерж релизной ветки — релиз не нужен"
              exit 0
            fi
            read -r BRANCH SHA <<< "$PR"
            MERGED="$PUSH_SHA"
          fi
          VERSION="${BRANCH#release/}"
          echo "Релиз $VERSION из $BRANCH ($SHA)"

          # Коммит релиза, на который встанут тег и main (fast-forward), должен быть в develop.
          # Обычно релизный PR мержат через squash: коммита ветки в develop нет, релиз собирается
          # из squash-коммита. Если смержили через merge commit — из последнего коммита ветки, тоже в develop.
          if ! git merge-base --is-ancestor "$SHA" origin/develop 2>/dev/null; then
            if [ -n "$MERGED" ] && git merge-base --is-ancestor "$MERGED" origin/develop 2>/dev/null; then
              SHA="$MERGED"
            else
              echo "::error::Коммит $SHA не попал в develop."
              exit 1
            fi
          fi

          CONF_VERSION=$(git show "$SHA:src-tauri/tauri.conf.json" | jq -r .version)
          [ "$CONF_VERSION" = "$VERSION" ] \
            || { echo "::error::В tauri.conf.json версия $CONF_VERSION, а ветка $BRANCH"; exit 1; }

          if gh release view "$VERSION" -R "$REPO" >/dev/null 2>&1; then
            echo "Релиз $VERSION уже опубликован, сборку пропускаю"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Список изменений
        if: steps.meta.outputs.branch != ''
        id: notes
        env:
          SHA: ${{ steps.meta.outputs.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # пункты из раздела «Для release notes» PR, вошедших в релиз (см. scripts/release-notes.sh)
          PREV=$(git describe --tags --abbrev=0 "$SHA^" 2>/dev/null || true)
          {
            echo 'body<<EOF_NOTES'
            bash scripts/release-notes.sh "${PREV:+$PREV..}$SHA" "$REPO"
            echo 'EOF_NOTES'
          } >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: needs.detect.outputs.branch != '' && needs.detect.outputs.published != 'true'
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Сборка и публикация релиза
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.detect.outputs.version }}
          releaseName: Macro Studio ${{ needs.detect.outputs.version }}
          releaseBody: ${{ needs.detect.outputs.notes }}
          releaseCommitish: ${{ needs.detect.outputs.sha }}
          releaseDraft: false
          prerelease: false
      - name: Убрать отдельные .sig (подпись уже внутри latest.json)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          gh release view "$VERSION" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name | select(endswith(".sig"))' |
            while read -r NAME; do gh release delete-asset "$VERSION" "$NAME" -R "$GITHUB_REPOSITORY" -y; done

  promote:
    needs: [detect, build]
    # build пропущен, если релиз уже опубликован (повторный запуск) — main всё равно догоняем
    if: >-
      always() && needs.detect.result == 'success' && needs.detect.outputs.branch != '' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}
      - name: Fast-forward main и удаление релизной ветки
        env:
          SHA: ${{ needs.detect.outputs.sha }}
          BRANCH: ${{ needs.detect.outputs.branch }}
        run: |
          git merge --ff-only "$SHA"
          git push origin main

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            git push origin --delete "$BRANCH" \
              || echo "::warning::Не удалось удалить ветку $BRANCH, удали её вручную"
          else
            echo "Ветка $BRANCH уже удалена"
          fi
